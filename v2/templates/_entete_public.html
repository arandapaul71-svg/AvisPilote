<header class="public-entete">

    <a class="logo" href="{% url 'accounts:accueil' %}">{% include "_logo.html" %} AvisPilote</a>

      <a href="{% url 'accounts:accueil' %}#fonctions">Fonctionnalités</a>

      <a href="{% url 'accounts:accueil' %}#questions">Questions</a>

      {% endif %}
